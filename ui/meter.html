<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Ludra BR - dano</title>
    <link rel="stylesheet" href="meter.css" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
      body { padding: 4px; }
      .meter { cursor: grab; }
      .meter .mRow[data-id] { cursor: pointer; }
      body.locked .meter { cursor: default; }
    </style>
  </head>
  <body>
    <div class="meter"></div>
    <script src="a2.js"></script>
    <script src="meterview.js"></script>
    <script src="names.js"></script>
    <script src="arrange.js"></script>
    <script>
      // The meter over the game: drawn from what the program reads, moved by
      // dragging while unlocked, a double-click opens the settings.
      const box = document.querySelector(".meter");
      const T = window.__TAURI__;
      let view = null, alpha = 1, show = {}, locked = false;
      if (T) {
        T.core.invoke("hotkey_label").then((k) => { if (typeof k === "string") { window.hotkeyLabel = k; draw(); } }).catch(() => {});
        T.event.listen("hotkey", (e) => { window.hotkeyLabel = e.payload; draw(); });
      }
      function draw() {
        renderMeter(box, view, { max: show.max, cp: show.cp, now: show.now, ping: show.ping });
        // Out of a fight it fades (or hides, or stays: "Fora da luta"), to see the game behind it.
        const fight = !!(view && view.rows && view.rows.length);
        const a = meterKit.idleAlpha(show.idle || "fade", fight, !locked && arrange.on, alpha);
        box.style.opacity = String(a);
        box.style.visibility = a > 0 ? "" : "hidden";
        box.style.transition = "opacity 0.4s";
        const r = box.getBoundingClientRect();
        // Hidden: no area, so clicks there go to the game.
        const area = a > 0 ? { x: r.left, y: r.top, width: r.width, height: r.height } : { x: 0, y: 0, width: 1, height: 1 };
        T && T.core.invoke("overlay_areas", { areas: [area] });
      }
      T && T.event.listen("meter", (e) => {
        view = e.payload;
        draw();
      });
      T && T.event.listen("meter-look", (e) => {
        const p = e.payload || {};
        box.style.setProperty("--o", String(p.opacity));
        box.style.transformOrigin = "0 0";
        box.style.transform = p.scale && p.scale !== 1 ? `scale(${p.scale})` : "";
        alpha = p.alpha ?? 1;
        show = p.show || {};
        draw();
      });
      T && T.event.listen("locked", (e) => { locked = !!e.payload; document.body.classList.toggle("locked", locked); draw(); });
      arrange.listen(draw);
      LudraNames.onChange(draw); // "Esconder nomes": the switch, or the button below the meter
      let press = null, last = 0, single = 0;
      box.addEventListener("mousedown", (e) => {
        if (e.button !== 0 || document.body.classList.contains("locked")) return;
        const row = e.target.closest(".mRow[data-id]");
        press = { x: e.screenX, y: e.screenY, id: row ? Number(row.dataset.id) : 0 };
      });
      document.addEventListener("mousemove", (e) => {
        if (!press || !(e.buttons & 1)) return void (press = null);
        if (Math.abs(e.screenX - press.x) + Math.abs(e.screenY - press.y) >= 4) {
          press = null;
          last = 0;
          T && T.core.invoke("overlay_drag");
        }
      });
      document.addEventListener("mouseup", () => {
        if (!press) return;
        const id = press.id;
        press = null;
        const now = Date.now();
        clearTimeout(single);
        if (now - last <= 400) {
          last = 0;
          T && T.core.invoke("show_main");
        } else {
          last = now;
          // One click on a player (no second one coming): their detail, in the settings window.
          if (id && T)
            single = setTimeout(() => {
              const row = ((view && view.rows) || []).find((r) => r.id === id);
              T.event.emitTo("main", "open-detail", { id, row });
              T.core.invoke("show_main");
            }, 420);
        }
      });
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      T && T.core.invoke("overlay_locked").then((v) => { locked = !!v; document.body.classList.toggle("locked", locked); draw(); });
      draw();
    </script>
  </body>
</html>
